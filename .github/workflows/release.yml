name: Release
on:
  push:
    branches: [ main ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # This is required for creating releases
      issues: write         # This is required for creating release notes
      pull-requests: write  # This is required if you want to manage PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }} 

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/git
          npm install -g @semantic-release/github
          # Pinned to the last 9.x release: 10.x requires
          # conventional-changelog-writer@9+, but semantic-release@25's
          # bundled @semantic-release/release-notes-generator still pins
          # conventional-changelog-writer@^8, so an unpinned install here
          # breaks generateNotes with "Missing helper".
          npm install -g conventional-changelog-conventionalcommits@9.3.1

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: semantic-release
