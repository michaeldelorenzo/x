name: Tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # sentry-go >= v0.46.0 requires Go >= 1.25.0 and formally dropped 1.24,
        # matching upstream's policy of supporting only the last two majors.
        go-version: [ '1.25' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go get ./...
      - name: Run tests
        run: go test ./...
